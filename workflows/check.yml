# .github/workflows/check.yml
name: check

on: [push, pull_request]

jobs:
  pages-match-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages must match their sources and CSP hashes
        run: python3 build.py --check
